[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sixeyes"
version = "0.1.0"
description = "Read-only forensic analyzer for agentic LLM waste"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sixeyes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sixeyes"]
