[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sixeyes"
version = "0.1.0"
description = "Read-only forensic analyzer for agentic LLM waste"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sixeyes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sixeyes", "pilots"]
explicit_package_bases = true
mypy_path = ["src", "."]
